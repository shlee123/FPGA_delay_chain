name: FPGA delay-chain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iverilog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run delay-chain simulation
        working-directory: sim
        shell: bash
        run: |
          set -o pipefail
          make SIMULATOR=iverilog clean sim 2>&1 | tee iverilog.log
      - name: Check result
        working-directory: sim
        shell: bash
        run: |
          grep -q "TEST PASSED" iverilog.log
          ! grep -Eiq "(^|[^A-Za-z])(fatal|error)([^A-Za-z]|$)" iverilog.log
