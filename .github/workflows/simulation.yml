name: Simulation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behavioral:
    name: Icarus behavioral simulation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog

      - name: Compile and run self-checking testbench
        run: bash sim/run_iverilog.sh
